<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Build, ship, iterate">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#39FF88"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F19" stop-opacity="1"/>
      <stop offset="1" stop-color="#0B0F19" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect y="0" width="1200" height="120" fill="url(#fade)"/>
  <rect y="0" width="1200" height="2" fill="url(#bar)" opacity="0.85"/>

  <text x="600" y="52" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" letter-spacing="7" fill="#00E5FF" fill-opacity="0.92">BUILD · SHIP · ITERATE</text>

  <text x="600" y="82" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="15" fill="#6F7C97">design is not decoration — it is the product</text>
</svg>
